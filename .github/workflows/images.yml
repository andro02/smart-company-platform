# Builds the Docker images on every push to main and publishes them to the
# GitHub Container Registry, so the small demo server only has to pull them
# (building there takes very long). Images:
#   ghcr.io/<owner>/<repository>-backend, -simulator, -web
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: back/smartcompany
            dockerfile: back/smartcompany/Dockerfile
          - image: simulator
            context: factory-simulator
            dockerfile: factory-simulator/Dockerfile
          - image: web
            context: .
            dockerfile: deploy/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
          # reuse unchanged layers (e.g. downloaded dependencies) between runs
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
