<div class="manager-list-container">

  <div class="list-header">
    <h2>Zahtevi za registraciju firmi</h2>
    <div class="d-flex gap-2 align-items-center">
      <select class="form-select" style="width: auto;" [(ngModel)]="status" (change)="onStatusChange()">
        <option value="PENDING">Na čekanju</option>
        <option value="APPROVED">Odobreno</option>
        <option value="REJECTED">Odbijeno</option>
        <option value="ALL">Svi</option>
      </select>
      <div class="search-wrapper">
        <input
          type="text"
          class="search-input"
          placeholder="Pretraži po nazivu firme..."
          [(ngModel)]="search"
          (ngModelChange)="onSearchChange()"
        />
        <span class="search-icon">🔍</span>
      </div>
    </div>
  </div>

  <p class="total-count" *ngIf="!loading">
    Ukupno: <strong>{{ totalElements }}</strong> zahteva
  </p>

  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Učitavanje...</p>
  </div>

  <div *ngIf="!loading" class="managers-grid">
    <div class="manager-card" *ngFor="let req of requests">
      <div class="card-info">
        <h3 class="card-username">{{ req.name }}</h3>
        <p class="card-email">{{ req.address }}, {{ req.city.name }}, {{ req.country.name }}</p>
        <p class="card-email">Vlasnik: {{ req.ownerUsername }}</p>
        <span class="status-badge"
              [class.active]="req.status === 'APPROVED'"
              [class.blocked-badge]="req.status === 'REJECTED'"
              [style.background]="req.status === 'PENDING' ? '#f0ad4e' : ''">
          {{ req.status }}
        </span>
      </div>

      <div class="card-actions">
        <a [routerLink]="['/companies/manage', req.id]" class="btn-block">Pregledaj</a>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && requests.length === 0 && !errorMessage" class="empty-state">
    <p>Nema pronađenih zahteva.</p>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button class="page-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">«</button>
    <ng-container *ngFor="let p of getPages()">
      <span *ngIf="p.toString() === '...'" class="page-btn disabled">…</span>
      <button *ngIf="p.toString() !== '...'"
              class="page-btn"
              [class.active]="p === currentPage"
              (click)="goToPage(+p)">
        {{ +p + 1 }}
      </button>
    </ng-container>
    <button class="page-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages - 1">»</button>
  </div>

</div>
