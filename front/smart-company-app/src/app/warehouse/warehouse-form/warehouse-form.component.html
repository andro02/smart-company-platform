<div class="container py-4" style="max-width: 860px;">

  <div class="d-flex align-items-center mb-4 gap-3">
    <a routerLink="/warehouses" class="btn btn-outline-secondary btn-sm">← Back</a>
    <h2 class="mb-0">{{ isEditMode ? 'Edit Warehouse' : 'New Warehouse' }}</h2>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Basic Info</h5>
      <div class="mb-3">
        <label class="form-label">Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="name" placeholder="Warehouse name">
      </div>
      <div class="mb-0">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" [(ngModel)]="address" placeholder="Street address">
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Location</h5>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Country <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="selectedCountryId" (change)="onCountryChange()">
            <option [ngValue]="null">Select country...</option>
            <option *ngFor="let c of countries" [ngValue]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">City <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="selectedCityId" [disabled]="!selectedCountryId" (change)="onCityChange()">
            <option [ngValue]="null">Select city...</option>
            <option *ngFor="let c of cities" [ngValue]="c.id">{{ c.name }}</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3" *ngIf="latitude != null">
        <div class="col-md-6">
          <label class="form-label">Latitude</label>
          <input type="text" class="form-control" [value]="latitude" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label">Longitude</label>
          <input type="text" class="form-control" [value]="longitude" readonly>
        </div>
      </div>

      <p class="text-muted small mb-2">
        <i class="bi bi-info-circle me-1"></i>
        Click on the map to set the warehouse location <span class="text-danger">*</span>
      </p>
      <div id="warehouse-map" style="height: 380px; border-radius: 8px;"></div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Images</h5>
      <input type="file" class="form-control mb-3" accept="image/*" multiple
             (change)="onImagesSelected($event)">
      <div *ngIf="uploadingImages" class="text-muted small mb-2">Uploading images...</div>
      <div class="d-flex flex-wrap gap-2">
        <div *ngFor="let url of imageUrls; let i = index" class="position-relative">
          <img [src]="url" style="width:100px;height:100px;object-fit:cover;border-radius:6px;">
          <button class="btn btn-danger btn-sm position-absolute top-0 end-0"
                  style="padding:2px 6px;font-size:11px;" (click)="removeImage(i)">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title mb-0">Sectors</h5>
        <button class="btn btn-outline-primary btn-sm" (click)="addSector()">
          <i class="bi bi-plus-lg me-1"></i> Add Sector
        </button>
      </div>
      <div *ngIf="sectors.length === 0" class="text-muted small">No sectors added yet.</div>
      <div *ngFor="let sector of sectors; let i = index" class="d-flex gap-2 mb-2">
        <input type="text" class="form-control" [(ngModel)]="sector.name"
               [placeholder]="'Sector ' + (i + 1) + ' name'">
        <button class="btn btn-outline-danger btn-sm" (click)="removeSector(i)">✕</button>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary px-4" (click)="submit()" [disabled]="loading || uploadingImages">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
      {{ isEditMode ? 'Save Changes' : 'Create Warehouse' }}
    </button>
    <a routerLink="/warehouses" class="btn btn-outline-secondary">Cancel</a>
  </div>

</div>
