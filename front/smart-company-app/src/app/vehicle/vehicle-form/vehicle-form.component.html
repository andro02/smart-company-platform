<div class="container py-4" style="max-width: 860px;">

  <div class="d-flex align-items-center mb-4 gap-3">
    <a routerLink="/vehicles" class="btn btn-outline-secondary btn-sm">← Back</a>
    <h2 class="mb-0">{{ isEditMode ? 'Edit Vehicle' : 'New Vehicle' }}</h2>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Basic Info</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">License Plate <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="licensePlate" placeholder="e.g. NS-123-AB">
        </div>
        <div class="col-md-6">
          <label class="form-label">Weight Limit (kg) <span class="text-danger">*</span></label>
          <input type="number" class="form-control" [(ngModel)]="weightLimit" placeholder="e.g. 3500" min="0">
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Brand & Model</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Brand <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="selectedBrandId" (change)="onBrandChange()">
            <option [ngValue]="null">Select brand...</option>
            <option *ngFor="let b of brands" [ngValue]="b.id">{{ b.name }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Model <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="selectedModelId" [disabled]="!selectedBrandId">
            <option [ngValue]="null">Select model...</option>
            <option *ngFor="let m of models" [ngValue]="m.id">{{ m.name }}</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="card-title">Images</h5>
      <input type="file" class="form-control mb-3" accept="image/*" multiple
             (change)="onImagesSelected($event)">
      <div *ngIf="uploadingImages" class="text-muted small mb-2">Uploading images...</div>
      <div class="d-flex flex-wrap gap-2">
        <div *ngFor="let url of imageUrls; let i = index" class="position-relative">
          <img [src]="url" style="width:100px;height:100px;object-fit:cover;border-radius:6px;">
          <button class="btn btn-danger btn-sm position-absolute top-0 end-0"
                  style="padding:2px 6px;font-size:11px;" (click)="removeImage(i)">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary px-4" (click)="submit()" [disabled]="loading || uploadingImages">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
      {{ isEditMode ? 'Save Changes' : 'Create Vehicle' }}
    </button>
    <a routerLink="/vehicles" class="btn btn-outline-secondary">Cancel</a>
  </div>

</div>
