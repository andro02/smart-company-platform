spring.application.name=smartcompany

server.servlet.context-path=/api

# secret files are not in the repository; "optional:" lets the application
# start without them (on a server the values come from environment variables)
spring.config.import=classpath:email.properties,optional:classpath:aws.properties,optional:classpath:mail-secret.properties,optional:classpath:factory-simulator.properties,optional:classpath:redis.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/smartcompanydb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update 
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

app.email.enabled=true

server.tomcat.threads.max=400
server.tomcat.accept-count=200

spring.datasource.hikari.maximum-pool-size=90
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# where uploaded files are kept: "local" (the server's disk, folder below) or
# "s3" (an AWS S3 bucket, needs the aws.* properties)
app.storage.type=local
app.storage.local.dir=uploads

# public demo accounts, one per role (see demo/DemoAccounts.java); off locally
app.demo.enabled=false
app.demo.password=demo1234
